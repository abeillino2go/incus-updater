[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incus-updater"
version = "1.0.0"
description = "Paralleler Incus Container Update Manager mit Terminal UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
]

[project.scripts]
incus-updater = "main:main"


[tool.setuptools]
# Wir listen alle einzelnen Skripte auf der obersten Ebene auf:
py-modules = ["main", "config", "logger", "output", "commands", "commands_snapshot"]


[tool.setuptools.packages.find]
include = ["ui", "models"]

