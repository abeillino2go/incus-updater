[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incus-updater"
version = "1.0.0"
description = "Paralleler Incus Container Update Manager mit Terminal UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
]

[project.scripts]
incus-updater = "main:main"

[tool.setuptools]
# Das zwingt Python, die main.py auf der obersten Ebene mit einzupacken!
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ui", "models"]
