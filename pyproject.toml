[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incus-updater"
version = "1.0.0"
description = "Paralleler Incus Container Update Manager mit Terminal UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
]

[project.scripts]
incus-updater = "incus_updater.main:main"

[tool.setuptools]
# Wir listen alle losen Skripte auf, damit sie mitkopiert werden:
#py-modules = ["main", "config", "logger", "output", "commands", "commands_snapshot"]
# NEU: Erlaubt das Mitverpacken von Konfigurations- oder README-Dateien
include-package-data = true

[tool.setuptools.package-data]
incus_updater = ["config.toml"]


[tool.setuptools.packages.find]
# Sucht weiterhin nach den Ordnern 'ui' und 'models'
where = ["src"]
